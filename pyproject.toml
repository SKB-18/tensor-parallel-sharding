[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tensor-parallel-sharding"
version = "0.1.0"
description = "Megatron-LM style Tensor Parallelism, ColumnParallel & RowParallel layers, AllReduce collectives, and Model Checkpoint Slicing."
authors = [{ name = "SKB-18" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "pytest>=7.0.0",
]

[project.scripts]
tp-engine = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
